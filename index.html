    <!-- Schema.org Structured Data (SoftwareApplication + FAQPage com 5 perguntas reais de pais) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Chamada Mágica do Papai Noel",
            "alternateName": "Portal Mágico do Polo Norte",
            "applicationCategory": "EntertainmentApplication",
            "operatingSystem": "iOS, Android, Web",
            "inLanguage": "pt-BR",
            "description": "Aplicativo web PWA de chamada de vídeo com Papai Noel ao vivo pelo nome, com personalização pelos pais, conversa interativa em português e despedida mágica.",
            "image": "/santa-avatar.png",
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "BRL",
              "lowPrice": "9.90",
              "highPrice": "39.90",
              "offerCount": "4"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Como funciona a Chamada de Vídeo com Papai Noel ao Vivo pelo Nome?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Os pais acessam a Área dos Pais protegida por um desafio matemático, escolhem o plano, preenchem o nome da criança, idade, elogios da semana e conselho carinhoso. Em 10 segundos o celular toca como uma ligação real de vídeo e o Papai Noel conversa chamando a criança pelo nome."
                }
              },
              {
                "@type": "Question",
                "name": "A chamada de vídeo funciona no iPhone (Safari) e no Android (Chrome) sem baixar aplicativo?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. O aplicativo funciona direto no navegador e como PWA instalável no Safari do iPhone e Chrome do Android, com desbloqueio automático de áudio e vídeo ao atender e botão Segurar para Falar otimizado para iOS."
                }
              },
              {
                "@type": "Question",
                "name": "Posso personalizar o elogio, o conselho e o motivo da despedida do Papai Noel?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. Os pais definem exatamente o que o Papai Noel deve elogiar sobre a semana da criança, qual conselho carinhoso reforçar e escolhem entre 4 motivos mágicos para o encerramento da chamada, como a Mamãe Noel chamando ou os duendes na fábrica."
                }
              },
              {
                "@type": "Question",
                "name": "Quais são os planos disponíveis e o que inclui o Passe Família Ilimitado?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Os planos vão de R$ 9,90 (Chamada Rápida de 15s) a R$ 29,90 (Conversa Mágica interativa de 60s), além do Passe Família Ilimitado por R$ 39,90 que libera chamadas de até 60 segundos ilimitadas para filhos, primos e sobrinhos até o Natal."
                }
              },
              {
                "@type": "Question",
                "name": "Como enviar a chamada pronta para abrir no celular de outro familiar?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Dentro do Painel dos Pais, basta preencher os dados da criança e clicar em Gerar Link Mágico para copiar a URL personalizada ou enviar por e-mail para abrir a ligação pronta em qualquer celular."
                }
              }
            ]
          }
        ]
      }
    </script>
